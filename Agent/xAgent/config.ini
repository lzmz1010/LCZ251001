[llm]
; 主模型：硅基流动 SiliconFlow（OpenAI 兼容），失败时自动回退到 [llm_backup]
base_url = https://api.siliconflow.cn/v1
api_key = sk-nxjxftfxdspcbunnmpfpbrxgcwleuxzpucqekkrnwjyjynov
model = deepseek-ai/DeepSeek-V3
temperature = 0.7

[llm_backup]
; 备用模型：本地 LM Studio
base_url = http://127.0.0.1:1234/v1
api_key = lm-studio
model = qwen/qwen3-8b
temperature = 0.7

[search]
baidu_qianfan_api_key = bce-v3/ALTAK-eFhhyWqH78XjFjrHsbcQW/8d096ef338b3fe6d7757f6289e4104920b0beb49
edition = standard
timeout = 60

[agent]
system_prompt = 你是本地Agent。遵守以下规则：1. 需要真实信息/实时数据/文件/命令时，必须调用工具，禁止凭空猜测或编造；工具返回结果后用自然语言整理回答用户。2. 本地技能优先：处理任务先调用 listSkills 查看本地技能，若存在匹配技能就调用 loadSkill 并按说明执行（技能要求运行脚本时用 RunCli 到其工作目录执行）；只有确认本地技能无法处理时，才调用 searchWeb/fetchWeb，禁止在加载涉及技能之前直接联网。3. 需要调用工具时，直接输出工具调用JSON，格式：{"name":"工具名","arguments":{"参数名":"参数值"}}，不要附带解释文字或"我将调用工具"这类说明。4. 需要实时新闻/近期数据/不确定信息且本地无技能时用 searchWeb，搜索摘要不足或需读正文/用户给链接时用 fetchWeb；执行本地程序用 RunCli。5. 回答必须严格只针对用户最新发来的这一条消息。这是最高优先级：禁止复读、复述、引用你上一轮已经给出的回答，禁止把上一句工具结果原文原样当答案，禁止重复用户自己的话，不要在回答中夹带历史对话里的旧内容。若拿不出可靠答案，就说明缺什么信息、需要哪些输入，不要用旧答案充数。可用工具：getDate、searchWeb、fetchWeb、RunCli、isLeapYear、getCwd、listDir、getFileType、readFile、createFile、editFile、mkdir、rmDir、rmFile、listSkills、loadSkill、createSkill（按用户自然语言要求创建新技能，name 用小写规范名、skillContext 为 SKILL.md 完整内容并补全 Frontmatter；如需 references/scripts 等辅助文件，再用 mkdir/createFile 等文件工具完成）。
max_tool_rounds = 8
empty_response_retries = 2

[skills]
dirs = D:\office\.agents\skills

[context]
; 模型上下文窗口大小（tokens）；留空时默认 128000，界面会显示「默认」提示。
; 如果知道模型的实际窗口大小，可以在这里显式填写，例如 context_window = 131072
; context_window =
warn_ratio = 0.7
summary_tokens = 5000
archive_dir = .agents/context
recall_limit = 8
snippet_max_chars = 300

[cli]
; 本地命令行工具 RunCli 参数
timeout = 30
max_output_chars = 20000

[fetch]
; 网页正文抓取 fetchWeb 参数
timeout = 30
max_html_bytes = 10485760
user_agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36

[mcp]
; MCP 客户端连接参数
default_timeout = 60
connect_timeout = 30

[sessions]
; 会话保存/恢复目录（/new /save /resume）
dir = .agents/sessions

[agents]
; AGENTS.md 项目约定注入：会话首次加载时注入一次，全程复用
inject = true
md_file = AGENTS.md

[ui]
render_interval = 0.08
context_refresh_interval = 5.0
